# The deliverable, built by a machine rather than by hand.
#
# Every symptom this workflow exists to prevent came from one cause: a
# release artifact whose provenance nobody could check. So the archive is
# assembled here, out of a tree that passed the gates, on each platform it
# claims to support - and `xtask package` refuses a binary carrying only
# the page shell, which is the defect that survives a green build and
# reaches a person as an empty browser window.
#
# C1 note: no step here invokes the node toolchain family; the client is
# WebAssembly built by cargo and wasm-bindgen.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is built for release out of a tree that has not passed.
  #
  # Windows, and only Windows: the archives this release ships are the
  # Windows and macOS ones, and this job runs the same check the person
  # develops against, so a red release verify is a red local `just check`
  # reproduced exactly. Linux is deliberately not part of this release
  # (see the archive job below).
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install pinned toolchain
        run: rustup show
      # The first run after a workflow change is cold: 494 packages compiled
      # from zero. Every run after that reuses the cache instead.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-public-api
      # The apisync gate reads rustdoc JSON, which is nightly-only. It
      # fails closed when the toolchain is missing rather than skipping,
      # so a release job without this line stops here instead of passing.
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # See ci.yml: the four trybuild suites are the whole of the test
      # phase, and they are cold rather than slow. Same cache, same key,
      # so a release reuses whatever the last push to main filled.
      - uses: actions/cache/restore@v4
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/*/tests/**') }}
          restore-keys: trybuild-${{ runner.os }}-
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      - name: deny
        run: cargo deny check
      - name: xtask gates
        run: cargo xtask gates
      # See ci.yml: the cache's save step cannot walk trybuild's scratch,
      # and a job whose every gate was green reported failure because of
      # it. This is the whole of release #5's `verify` failure, and it
      # bites again whenever the step runs in PowerShell, where `rm -rf`
      # is not a legal invocation - so the shell is named, as it already
      # is in platforms.yml.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  # Two platforms. Linux is deliberately out of this release: its
  # archive was the one job nobody could run the result of on the machine
  # the project is developed on, and the person ruled it out of the
  # pipeline rather than debug a platform they cannot see. The macOS and
  # Windows archives are the product; the ubuntu `check` job that used
  # to gate every push is gone with it.
  # Archive does not wait for verify: the two are independent, publish
  # waits for both, and the wall clock is the slower one instead of the sum.
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - name: the client target
        run: rustup target add wasm32-unknown-unknown
      # The CLI version must equal the crate version; a mismatch there is
      # the quietest way to break a wasm build. It used to be held by a
      # copy of the version plus an assertion that watched the copy - one
      # version with three authorities, and the assertion is what failed
      # the macOS job in release #5. The manifest is now read directly, so
      # there is nothing left to fall behind and nothing left to assert.
      - name: the version the workspace pins
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^wasm-bindgen = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "the workspace pins wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen-cli@${{ steps.pin.outputs.version }}
      - name: build the client, the binary, and the archive
        shell: bash
        run: just package
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}
          path: target/package/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: attach the archives to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la assets
          # Re-cutting a tag is a legitimate thing to do, and this step
          # could only ever run once: `gh release create` refuses a tag
          # that already carries a release, so a corrected build of the
          # same version failed at the last step with every archive
          # already built and verified. Replaced rather than appended to,
          # so what hangs off a tag is always what that tag's tree
          # produced - a release holding archives from two different
          # trees is worse than one that failed loudly.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          # Pre-release is the state this project is in, and it was being
          # set by hand after every publish - which means it was one
          # forgotten click away from a pre-alpha presenting itself as the
          # release a person should download. The day that stops being
          # true, this flag is what gets deleted, deliberately.
          gh release create "${GITHUB_REF_NAME}" assets/*.zip \
            --title "sprawling ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes-file .github/release-notes.md
