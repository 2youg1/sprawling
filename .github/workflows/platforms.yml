# What ci.yml deliberately does not ask on every push.
#
# Two claims live here, and both are about machines rather than about a
# change. A4/V8 assert byte identity across platforms, so a platform this
# workflow does not run is a promise rather than a fact. V5 proves eleven
# kernel properties against real MIR, which is Linux-only upstream and
# minutes long either way.
#
# They run on a schedule and on demand instead of on every push because a
# gate nobody waits for is a gate nobody runs - and a twenty-minute wait
# on every commit is how the fast gates stopped being read at all.
#
# Both are functions of the commit: judged twice, one commit gives one
# verdict. So the schedule asks first whether main has moved, and a night
# that changed nothing costs one checkout instead of two runners (P4.05).
name: platforms
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Has main moved since the last scheduled run? The window is 25 hours,
  # one hour wider than the cron interval, so a commit that lands minutes
  # before a run is never missed by an off-by-one. Asking by hand always
  # runs: `workflow_dispatch` is itself the answer to "is this worth a
  # runner". The commit date comes from git rather than from an API, so
  # this job needs nothing but a checkout - it is why ubuntu is legal
  # here despite P4.02, which ruled the platform out of *builds*.
  moved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.head.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
      - id: head
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt 90000 ]; then
            echo "verdict=run" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "main last moved $(( age / 3600 )) hours ago; nothing new to judge" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same commands ci.yml runs, on the platform ci.yml never sees.
  #
  # macOS alone: this matrix used to carry a windows leg as well, which
  # was the same four commands ci.yml already runs on windows for every
  # push. A gate that repeats a gate teaches nobody anything and costs a
  # runner an hour a night, so the leg is gone rather than kept for
  # symmetry.
  macos:
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # `guard` and `apisync` read one commit and its parent; ci.yml
      # gives the reasoning.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-public-api
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      # One job rather than ci.yml's five: nobody is waiting for this
      # one, and the sum of two builds costs a schedule nothing.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: xtask gates
        run: cargo xtask gates
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      # See ci.yml: the cache's save step cannot walk trybuild's scratch.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  kani:
    # V5: the kernel harnesses (cfg(kani)); Linux-only upstream - the one
    # ubuntu build left in the pipeline, kept because it works and because
    # there is no other platform the tool runs on. Everything else moved
    # to the platform the project is developed on.
    needs: moved
    if: needs.moved.outputs.verdict == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      # `--default-unwind` is why this job can return at all. Seven of the
      # eleven harnesses build a Vec, a String or a BTreeSet, and CBMC
      # cannot derive a bound for the loops inside them: every run since
      # the first unwound BTreeSet's dying-node walk past iteration 11,900
      # and hit the platform's six-hour ceiling on the third harness, so
      # V5 has never yet produced a verdict. A bound does not weaken the
      # proof - kani asserts that its own bound was large enough, so a 32
      # that is too small turns this job red rather than green - and a
      # harness that needs more can carry its own `#[kani::unwind]`.
      # 32 covers what the harnesses actually walk: a 20-digit u64 written
      # out by `format!`, and a 17-character reserved address parsed.
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p kernel --default-unwind 32
