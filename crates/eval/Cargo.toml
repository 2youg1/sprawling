[package]
name = "eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The topology allows kernel and memory (ARCHITECTURE 2). Only kernel is
# taken: this crate decides, and the register it decides about is read by
# whoever calls it.
kernel = { path = "../kernel" }
# The three formats the nesting suite grades. Read rather than written:
# this crate decides which shape a model edits best, and the answer is a
# number, so both parsers are used only to find a document's leaves.
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
