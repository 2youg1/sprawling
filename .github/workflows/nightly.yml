# The slow assurances: work that earns its place by running while nobody
# waits for it. The freeze-leak scenarios (a thousand freeze cycles) run
# inside `just check` too; here they run on a schedule so a regression
# cannot hide between manual gate runs. Fuzz targets are smoke-length -
# long campaigns belong to a dedicated runner, not a CI slot.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # --all-features, as everywhere else: without it these two commands
      # resolve a feature set no other command in the repository ever
      # builds, so they compile their own tree and can fail on their own.
      - name: thousand-session freeze leak
        run: cargo nextest run -p citysim --locked --all-features -E 'binary(freeze_leak)'
      - name: long-batch simulation
        run: cargo nextest run -p citysim --locked --all-features
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        run: rm -rf target/tests

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain and nightly
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # `+nightly` explicitly: rust-toolchain.toml pins 1.97.1, so without
      # it cargo-fuzz runs under the pinned stable toolchain and refuses
      # the nightly-only flags it needs. That is what this job did.
      - name: each target, sixty seconds
        run: |
          for target in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            cargo +nightly fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=60
          done
