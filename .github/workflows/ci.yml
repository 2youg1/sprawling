# The gate a change closes on, run by a machine.
#
# `just check` is four commands and CI used to run all four in one job,
# one after another. Two of them are full compiles of the same tree that
# cannot share a single artifact: `cargo clippy` builds in check mode
# (`--emit=metadata`) and `cargo nextest` needs real rlibs, which is
# measurable rather than folklore - clean one crate, `cargo clippy -p
# kernel` says "Checking kernel", and `cargo build -p kernel --lib`
# immediately after says "Compiling kernel". So the job's wall clock was
# the *sum* of two builds. Split across jobs that start together, it is
# the slower of the two.
#
# Five jobs, none waiting on another. Together they are exactly `just
# check` plus `just check-web` plus the supply-chain read, and CI must
# never be weaker than the local command: a green CI that implies less
# than a green `just check` is worse than no CI.
#
#   clippy   fmt, then the zero-warning build of every target and feature
#   test     the suite; the only job that produces trybuild scratch
#   gates    the sixteen machine gates, and the nightly rustdoc apisync
#            needs (27s of a 27.5s gate run locally - it is why the other
#            twelve no longer queue behind a compile)
#   web      the two places `just check` cannot reach
#   supply   licences, bans and sources; compiles nothing
#
# Windows, and only Windows, is deliberate and unchanged: it is the
# platform the project is developed on, so a red job is a red local run
# the person can reproduce. macOS byte-identity is `platforms.yml`,
# nightly. Linux stays out of the push pipeline for the reason recorded
# there, and nothing in this release ships a Linux artifact.
#
# Not done, because it was measured and did not pay: forcing debuginfo
# off in CI. Dependencies already carry `debug = false` (root
# `Cargo.toml`), which is where the mass was, and rebuilding plus
# relinking the largest test binary with `CARGO_PROFILE_DEV_DEBUG=0`
# moved 11.7s to 9.6s while the full workspace build moved the wrong way.
# A second of noise is not a lever; leave the backtraces alone.
#
# C1 note: GitHub Actions infrastructure is not part of the artifact build
# chain. The zero-js gate that asserted this was deleted at V3.25: it
# excluded an architecture rather than a defect.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Incremental compilation caches work for the *next* build in the same
  # tree, and CI throws the tree away. It buys nothing here and it makes
  # the artifact the cache has to carry substantially larger.
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

# A second push supersedes the first: nobody reads the verdict on a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt answers in two seconds and rides along here rather than in a job
  # of its own: a whole runner, a whole toolchain download and a whole
  # queue wait to save two seconds is not speed.
  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      # Without this every run compiles 494 packages from zero - including
      # aws-lc-sys and libgit2, which are C. It is the single largest
      # difference between a five-minute run and a twenty-minute one.
      # A key per job, because check-mode metadata and real rlibs are
      # different artifacts and one key would make two jobs overwrite each
      # other's cache all day. Only the branch everyone builds on writes:
      # a pull request that saved its own would evict the shared one it
      # was restored from, and the next unrelated push would pay for a
      # cold build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all --check
      # --all-features is load-bearing and must match `just check` word for
      # word: code behind a feature (runtime/wasm, */conformance) escapes
      # the zero-warning gate without it.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The four trybuild suites were the whole of this job's test phase:
      # 369s of a 370s run. They are not slow, they were cold - measured
      # on the developer machine, one suite is 21.4s against an empty
      # scratch and 0.9s against a warm one. The scratch is deleted below
      # so that rust-cache can save, so it was cold on every run by
      # construction, and this job paid the first build of it forever.
      #
      # Restored and saved explicitly rather than by a post-step, because
      # the order is the whole point: save has to happen after the tests
      # that fill the scratch and before the step that empties it, and a
      # post-step cannot be placed between two ordinary ones.
      - uses: actions/cache/restore@v4
        id: trybuild-scratch
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/*/tests/**') }}
          restore-keys: trybuild-${{ runner.os }}-
      # No `--doc` companion: this workspace has no doctest, which is a
      # fact about it (`rg '///\s*```' crates/*/src` finds nothing), not
      # an omission for somebody to fix later by adding a slower command.
      - name: tests
        run: cargo nextest run --workspace --locked --all-features

      # Only the branch everyone builds on writes, for the reason the
      # rust-cache blocks above give: a pull request that saved its own
      # would evict the shared entry it was restored from.
      - uses: actions/cache/save@v4
        if: ${{ github.ref == 'refs/heads/main' && steps.trybuild-scratch.outputs.cache-hit != 'true' }}
        with:
          path: target/tests
          key: trybuild-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/*/tests/**') }}

      # trybuild keeps its scratch tree under `target/tests`, including an
      # entry that does not survive the cache's own pruning pass. The save
      # step then walks target/ and stops on it - which is how a job whose
      # every gate was green still reported failure (rust-cache#193). The
      # scratch is a test artifact, so nothing is lost by clearing it, and
      # this is the one job that runs tests and therefore creates it.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        shell: bash
        run: rm -rf target/tests

  gates:
    runs-on: windows-latest
    steps:
      # `guard` and `apisync` judge every commit in a range, and the range
      # is the whole change-set under review. This step used to take
      # `fetch-depth: 2` under a note saying no workflow passed a range.
      # The note was true and it was the hole: guard judged the tip commit
      # alone, so a pull request could carry a gate-loosening commit in the
      # middle and still go green, while xtask-SPEC.md section 3 had
      # promised the range all along. No fixed depth replaces this, because
      # a base branch can sit any distance back.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api
      # The apisync gate reads rustdoc JSON, which is nightly-only. It
      # fails closed when the toolchain is missing rather than skipping,
      # so a job without this line stops here instead of passing.
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      # base..head for a pull request, before..after for a push. A push
      # that rewrote history leaves `before` unreachable in a fresh clone,
      # and a first push has no `before` at all; both fall back to HEAD and
      # say which they did, because a range that cannot be resolved must
      # not read as a range that was clean.
      - name: xtask gates
        shell: bash
        run: |
          set -euo pipefail
          reachable() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          case "${{ github.event_name }}" in
            pull_request)
              base='${{ github.event.pull_request.base.sha }}'
              tip='${{ github.event.pull_request.head.sha }}'
              if reachable "$base" && reachable "$tip"; then
                range="$base..$tip"
              else
                echo "::error::pull request range $base..$tip is not in this clone"
                exit 1
              fi
              ;;
            push)
              before='${{ github.event.before }}'
              if reachable "$before"; then
                range="$before..${{ github.sha }}"
              fi
              ;;
          esac
          if [ -n "$range" ]; then
            echo "judging $range"
            cargo xtask gates --range "$range"
          else
            echo "judging HEAD alone"
            cargo xtask gates
          fi

  # The two places `just check` cannot reach: web's wasm-only paths, and
  # channels built without its server feature.
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - name: the client target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy on the target that has a browser
        run: cargo clippy -p web --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

  # Licences, banned crates and where they came from. It compiles nothing
  # - it reads `Cargo.lock` - so it is the verdict that arrives first.
  #
  # `advisories` is deliberately **not** here. An advisory published today
  # against a dependency nobody touched would turn a pull request red for
  # a reason that has nothing to do with it, which is how people learn to
  # ignore a red build. It runs nightly, where red means "go and look".
  supply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: licences, bans and sources
        run: cargo deny check bans licenses sources
