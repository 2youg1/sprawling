# The deliverable, built by a machine rather than by hand.
#
# Every symptom this workflow exists to prevent came from one cause: a
# release artifact whose provenance nobody could check. So the archive is
# assembled here, out of a tree that passed the gates, on each platform it
# claims to support - and `xtask package` refuses a binary carrying only
# the page shell, which is the defect that survives a green build and
# reaches a person as an empty browser window.
#
# C1 note: no step here invokes the node toolchain family; the client is
# WebAssembly built by cargo and wasm-bindgen.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is built for release out of a tree that has not passed.
  # The host is the shipped platform, by the person's ruling: Linux is
  # neither verified nor shipped for now, and its fitness is tracked in
  # TODO.md rather than blocking a release that does not carry it.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install pinned toolchain
        run: rustup show
      # The first run after a workflow change is cold: 494 packages compiled
      # from zero. Every run after that reuses the cache instead.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-public-api
      # The apisync gate reads rustdoc JSON, which is nightly-only. It
      # fails closed when the toolchain is missing rather than skipping,
      # so a release job without this line stops here instead of passing.
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      - name: deny
        run: cargo deny check
      - name: xtask gates
        run: cargo xtask gates
      # See ci.yml: the cache's save step cannot walk trybuild's scratch,
      # and a job whose every gate was green reported failure because of
      # it. This is the whole of release #5's `verify` failure.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        run: rm -rf target/tests

  # The absence of Linux is written here rather than left to be noticed:
  # a platform missing from a release page is a decision, not an oversight.
  # Archive does not wait for verify: the two are independent, publish
  # waits for both, and the wall clock is the slower one instead of the sum.
  archive:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - name: the client target
        run: rustup target add wasm32-unknown-unknown
      # The CLI version must equal the crate version; a mismatch there is
      # the quietest way to break a wasm build. It used to be held by a
      # copy of the version plus an assertion that watched the copy - one
      # version with three authorities, and the assertion is what failed
      # the macOS job in release #5. The manifest is now read directly, so
      # there is nothing left to fall behind and nothing left to assert.
      - name: the version the workspace pins
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^wasm-bindgen = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "the workspace pins wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen-cli@${{ steps.pin.outputs.version }}
      - name: build the client, the binary, and the archive
        shell: bash
        run: just package
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}
          path: target/package/*.zip
          if-no-files-found: error

  publish:
    needs: [verify, archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: attach the archives to the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la assets
          gh release create "${GITHUB_REF_NAME}" assets/*.zip \
            --title "sprawling ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
