[package]
name = "channels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The listener. Off for `web`, which needs this crate's vocabulary and must
# not drag a TCP stack into WebAssembly - tokio's mio does not build for
# wasm32, and a browser has no sockets to listen on anyway.
default = ["server"]
server = ["dep:tokio", "dep:axum"]

[dependencies]
kernel = { path = "../kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
axum = { workspace = true, features = ["ws"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
