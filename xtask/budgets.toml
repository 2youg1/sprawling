# The performance register. One row per budget the design states, and the
# best reading recorded so far.
#
# `xtask budget` refuses two things: a reading above `budget_bytes`, and a
# reading worse than `best_bytes` by more than `slack_bytes`. The second is
# the ratchet - a number may improve freely and may drift only within the
# slack, so a gradual regression cannot arrive one commit at a time.
#
# A metric is gated only when a machine can measure it the same way twice.
# Wall-clock figures depend on the machine that ran them, so they are
# measured and reported with their machine rather than gated; gating them
# would make a busy runner look like a defect. Each such row says what it
# needs, so nobody has to guess why it is not enforced.

# P3.05 moved this reading from 278,829 to 302,038: the city page stopped
# being an empty div and became a painted canvas, which brings in two
# web-sys canvas bindings and the first real drawing code the client has
# had. A deliberate 8% for the product's centrepiece, recorded here so the
# ratchet keeps holding the line from the new number rather than being
# widened. Headroom against the budget is still about 6.9x. P3.15 records
# 307,861 after the two forms landed: within the slack, and written down
# so the line moves with what is actually shipped.
# The remediation pass corrected the scale itself: the weight now walks the
# bundle recursively, so the wasm-bindgen snippets the page actually loads
# are finally on it (+10.5 KB that were always being downloaded).
# R1.06 records 384,018: four views that had been rendering as empty divs
# are now mounted, and their markup, microcopy and event handlers are the
# 65.6 KB. The old figure was the weight of a client that could only show
# one page - cheaper, and not a client. Headroom is still 5.5x.
# R1.11 records 416,116: the building page (a building's own documents and
# its archive) and the city's building index. Headroom 5.0x.
# F1.06 records 461,921 for the front-end stage as a whole: the five views
# that had answers and no page (recycle bin, room mailbox, archive search,
# the vital signs strip) plus the progress bar's one rendering point and
# the grouped nav. 45.8 KB for the half of the product that was reachable
# only by reading the source. Headroom 4.5x, and the ratchet holds from
# the new number rather than being widened.
# F2.02-F2.05 records 490,594. The isometric city moved from a canvas to
# shapes in the document, which was close to weight-neutral - the canvas
# drawing code it deleted paid for the markup it added. The 28.7 KB is the
# rest of the front-end rebuild: a four-part panel grammar on nine pages, a
# three-part empty state wherever a container can be empty, the overview
# page, and the interventions that had no way to be sent. Microcopy is most
# of it, and it is the product's voice rather than padding: a page that
# states a figure now says what produced it. Headroom is still 4.3x against
# a budget of 2 MB, and the ratchet holds from the new number.
# P3.06 records 558,419 after the person ruled on the drift the P4 row had
# been holding open. The 67.8 KB since F2.05 is two things that were asked
# for: `web::lang`'s second language, which is a table of every string the
# interface says rather than a mechanism (F2.14, F2.18), and the four
# client modules the same stage added. Neither is slack that accumulated -
# each is a feature somebody uses - so the reading is recorded rather than
# recovered, and the ratchet holds the line from here. Headroom against the
# 2 MB budget is 3.8x, which is why this is not the size to spend attention
# on today.
# ux-6 records 580,157. The 21.2 KB since P3.06 is the keyboard: `web::keys`
# and `web::palette`, the key map the `?` key opens, and the thirteen phrases
# the two of them say in both languages. It is what makes every page and
# every building reachable without a pointer, in a client whose readers work
# a keyboard all day - a feature somebody uses rather than slack that
# accumulated, so the reading is recorded and the ratchet holds from here.
# Headroom against the 2 MB budget is 3.6x.
# ux-11..ux-14 records 614,807 on the person's ruling. The 34.6 KB since
# ux-6 was weighed one card at a time, each figure from its own release
# build: ux-11 +8.3 KB, ux-12 +4.9 KB, ux-13 +4.1 KB, ux-14 +11.9 KB, and
# 5.4 KB of drift from ux-7..ux-10 that stayed inside the slack and was
# never re-recorded. What it bought is the session, which is where
# everything this product does differently actually happens and where all
# of it used to render as the same grey line: a turn that says what the
# model said, what it cost in tokens and dollars, what each tool
# answered, and what a door refused in three parts; a drop that reaches
# the box work is written in and lights up while a drag is over it; a
# query that can ask for one session, without which yesterday's session
# opened blank; and the change list a person reads to find what an agent
# touched, with the counts taken from git between two real checkpoints.
# Microcopy in two languages is most of the weight, as it was at F2.05
# and P3.06 - it is the product's voice rather than padding. Headroom
# against the 2 MB budget is 3.4x, and the ratchet holds from here.
# V3.44-V3.50 records 672,246, and the gap it closes is not a regression:
# it is the first reading taken since the client was last built. The
# 57.4 KB above the ux-14 line is v0.0.3's own front-end work - the
# session page, the board, the plan tree, the record and waiting pages,
# the pursuit panel, `web::phase` and `web::prompt` - none of which had
# ever been weighed, because nothing in `just check` builds the wasm and
# nobody had run `just build-web` through the whole stage. The badge said
# so all along and was not read either.
#
# This session's own share is 317 B, measured rather than estimated:
# the client was built once from this tree and once from 506145c with
# only `app.css`, `theme.rs`, `lang.rs` and `dashboard.rs` reverted, and
# both dist directories were weighed the same way (670,483 against
# 670,166). Two font stacks, three phrases and the comments that record
# why they exist.
#
# The line therefore moves to what the product actually weighs today, and
# the ratchet holds from here. Headroom against the 2 MB budget is 3.1x.
#
# V3.51-V3.52 records 673,488 on the person's ruling, which also settled
# the 672,246 above: the gap was accepted rather than recovered, because
# every byte of it is a feature and none of it is slack. The 1.2 KB since
# is this stage's own, and it is eleven phrases in two languages - the
# approval page's count and its two verbs, the four column heads of the
# record table, a document's size, the cost page's unpriced cell, the
# filter line, and the accessible name of the button that dismisses a
# refusal. Each one replaced an English literal that a Chinese page was
# rendering as English, which is the defect `xtask wording` now refuses;
# the stylesheet and the font stack changed in the same stage and weigh
# nothing next to microcopy, as they have at every reading since F2.05.
# Headroom against the 2 MB budget is 3.1x, and the ratchet holds.
[frontend_artifact]
what = "the client the browser downloads, gzipped, fonts excluded"
budget_bytes = 2097152
best_bytes = 673488
slack_bytes = 20480
measured_by = "just build-web, then just gates (the whole dist directory, recursive)"
status = "gated"
# The badge in README.md. Rendered from the reading above by
# `cargo xtask badge --write`, which `just dist` ends with, so nobody
# edits a size by hand. No platform row: the bundle is one wasm target
# and weighs the same wherever it is built.
badge_label = "client"

# The remediation pass found the single-binary promise was hollow: build.rs
# embedded a 1,306-byte placeholder and the real client never shipped. The
# binary now carries the whole gzipped bundle (about +330 KB), and the gate
# refuses a release binary whose file table lacks web_bg.wasm, so this
# cannot regress silently. The ratchet holds the line from the first honest
# reading.
# P3.06 records 8,620,032, freshly linked rather than read off a stale
# artifact. Of the 1.37 MB since the first honest reading, the largest
# single cause is tokio's `signal` feature, which is what lets a Windows
# console deliver both of its stop signals to a city that must close its
# ledger cleanly (P3.05b) - a binary that exits without that is smaller and
# wrong. This card's own two modules measure 12,800 B of it, taken by
# building the binary before and after. Recorded on the person's ruling:
# the growth is bought, not drifted, and 15.6x headroom against the 128 MB
# budget says the next reading to spend attention on is not this one.
[release_binary]
what = "the single binary a person installs, before fonts, wasmtime and CPython are embedded"
budget_bytes = 134217728
best_bytes = 8620032
slack_bytes = 1048576
measured_by = "just build-web, cargo build --release, then just gates"
status = "gated"
# A binary's size is a fact about the platform that linked it, so the
# badge names one machine and only that machine may refresh it. Three
# platforms writing one file would make the badge churn rather than
# report. Change this row when a release workflow takes the job over.
badge_label = "binary · windows-x86_64"
badge_platform = "windows-x86_64"

# The unit is a production function because the alternative was measured:
# any honest file threshold lights up eight files across four crates at
# once, which is a project rather than a gate. Across 1,800 production
# functions the median is 9 lines, p90 is 39 and p99 is 145, so 200 sits
# well above where the repository actually writes; what it catches is a
# whole flow of control written into one body. `dispatch_in` was 1,069
# lines when R2 opened and is 158 now, in nine cuts.
#
# Not measured, each read from an authority that already exists rather
# than from a list kept beside the gate: an item marked `#[cfg(test)]`,
# a function marked `#[component]` (a Dioxus component's body is markup),
# and a file whose module-map row states the shape `data`.
[function_length]
what = "one production function, from its `fn` to its closing brace"
budget_lines = 200
measured_by = "cargo xtask length (syn spans, not brace counting)"
status = "gated"

# A long function hides a flow of control; a long file hides where
# anything is. The second is what the person asked for on 2026-09-02,
# after the largest file reached 12,078 lines and iteration on it began
# costing more than the split would.
#
# Tests count. A `#[cfg(test)] mod tests` is exempt from the *function*
# rule, because a long test is a different question from a long body -
# but a reader looking for one thing pays for every line above it either
# way, and in the file that prompted this rule the tests were 6,133 of
# the 12,078.
# "The ideal number of arguments for a function is zero. Next comes one,
# followed closely by two. Three arguments should be avoided where
# possible. More than three requires very special justification - and
# then shouldn't be used anyway." A long parameter list is a data clump:
# the values that always travel together are one value that has not been
# given a name yet, and this repository already contains the fix it is
# asking for. `Reporter` says it in its own doc - "Four values that
# always travel together and are never chosen independently, so they
# travel as one".
#
# The budget is 4 rather than Bob's 3, because 3 is the number a
# constructor for a three-field value legitimately needs and the gate
# should not argue with those.
[argument_count]
what = "one function's parameters, not counting a receiver"
budget_arguments = 4
measured_by = "cargo xtask length (syn signatures)"
status = "gated, with a register of the signatures that predate the rule"

# The signatures that predate the rule (2026-09-02), worst first. A name
# not on this list is refused outright, so the list cannot grow; a
# signature is struck from it by giving the values that travel together a
# name, never by widening the budget. Forty-two when the rule was drawn,
# twenty-four now.
#
# Sixteen of the original forty-two were in `bin::assembly`, and so were
# the worst six. That was the file rule's finding reached from another
# direction: the module is declared `adapter` - "thin, no policy" - and
# held the city's dispatch policy instead, and an eleven-parameter
# private method is what policy looks like when it has no object to live
# in. V3.43 spent fifteen of them, because splitting that file into
# `assembly/` would otherwise have carried each excuse to a new address -
# which is the one budgets.toml edit `guard` will not treat as a strike.
[argument_count.predating]
