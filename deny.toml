# cargo-deny config (C12, B.7). Runs in CI; local when installed.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
# C12 note: the regex ban is scoped to the kernel decision surface and is
# enforced by review plus kernel lints, not here.
deny = [
    { crate = "openssl-sys", reason = "TLS policy is rustls" },
    { crate = "native-tls", reason = "TLS policy is rustls" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
