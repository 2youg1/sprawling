# The gate a change closes on, run by a machine.
#
# One Linux job carries the whole of `just check`, with its steps ordered
# cheap-to-expensive so the first real verdict arrives in seconds rather
# than at the end. The other two platforms and the kani harnesses moved to
# `platforms.yml`, which runs nightly: they answer a different question
# (does this hold on every machine) from the one a push asks (did I break
# something), and paying for the first on every push is what made the
# second take half an hour.
#
# C1 note: GitHub Actions infrastructure is not part of the artifact build
# chain; the zero-js gate asserts our own commands never invoke npm/node.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first: nobody reads the verdict on a commit
# that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `guard` and `apisync` read git history, so the whole of it is
      # fetched rather than the single commit a shallow checkout gives.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: install pinned toolchain
        run: rustup show
      # Without this every run compiles 494 packages from zero - including
      # aws-lc-sys and libgit2, which are C. It is the single largest
      # difference between a five-minute run and a twenty-minute one.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-public-api
      # The apisync gate reads rustdoc JSON, which is nightly-only. It
      # fails closed when the toolchain is missing rather than skipping,
      # so a job without this line stops here instead of passing.
      - name: nightly toolchain (rustdoc JSON for apisync)
        run: rustup toolchain install nightly --profile minimal

      # Ordered by seconds-to-verdict. fmt answers in two; clippy builds
      # the test targets that nextest and apisync then reuse; the gates
      # read documents against a tree that is already compiled.
      - name: fmt
        run: cargo fmt --all --check
      # --all-features is load-bearing and must match `just check` word for
      # word: code behind a feature (runtime/wasm, */conformance) escapes
      # the zero-warning gate without it, and a CI weaker than the local
      # command means a green CI stops implying a green `just check`.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: xtask gates
        run: cargo xtask gates
      - name: tests
        run: cargo nextest run --workspace --locked --all-features
      - name: deny
        run: cargo deny check

      # trybuild keeps its scratch tree under `target/tests`, including an
      # entry that does not survive the cache's own pruning pass. The save
      # step then walks target/ and stops on it - which is how a job whose
      # every gate was green still reported failure (rust-cache#193). The
      # scratch is a test artifact, not a build artifact, so nothing is
      # lost by clearing it and the cache stops tripping over it.
      - name: clear the trybuild scratch before the cache is saved
        if: always()
        run: rm -rf target/tests

  # The two places `just check` cannot reach, and so far neither could CI:
  # web's wasm-only paths, and channels built without its server feature.
  # Cheap, and parallel to the job above, so it costs no wall clock.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pinned toolchain
        run: rustup show
      - name: the client target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: clippy on the target that has a browser
        run: cargo clippy -p web --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
